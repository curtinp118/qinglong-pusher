# qinglong-pusher | local console
# Enable Rewrite and MitM, then open https://qlpush.com/
# Merge [http_backend] into the QX main configuration if a rewrite reference does not load it.
[rewrite_local]
^http://qlpush\.com(?:/.*)?$ url 302 https://qlpush.com/
^https://qlpush\.com/api/(?:preview|profiles(?:/[a-z0-9-]+/delete)?|panel(?:/(?:delete|test))?)$ url script-analyze-echo-response https://raw.githubusercontent.com/curtinp118/qinglong-pusher/main/release/qx/local.js
^https://qlpush\.com(?:/.*)?$ url script-echo-response https://raw.githubusercontent.com/curtinp118/qinglong-pusher/main/release/qx/local.js

[mitm]
hostname = qlpush.com

[http_backend]
https://raw.githubusercontent.com/curtinp118/qinglong-pusher/main/release/qx/backend.js, tag=qinglong-pusher, path=^/qinglong-pusher/scripts/, enabled=true
